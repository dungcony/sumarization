# Phase 2b: unfreeze toàn bộ, train với LR cực thấp.
phase:
  name: "phase_2b"
  description: "Phase 2b: Unfreeze all, train với LR thấp để tinh chỉnh."

model:
  name_or_path: "outputs/vit5_base_phase_2a/best" # Load từ phase 2a
  use_fast_tokenizer: false
  trust_remote_code: false

data:
  train_file: "data/phase_2/train_*.*"
  valid_file: "data/phase_2/validation_*.*"
  test_file: "data/phase_2/test_*.*"
  source_prefix: "summarize: "
  max_source_length: 768
  max_target_length: 160

training:
  output_dir: "outputs/vit5_base_phase_2b"
  seed: 42
  num_train_epochs: 2
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 0.000001 # 1e-6 (Rất thấp)
  weight_decay: 0.005 # Giảm weight decay
  warmup_ratio: 0.15 # Warmup dài hơn
  lr_scheduler_type: "cosine"
  label_smoothing_factor: 0.05
  precision: "auto"
  freeze_encoder: false # Mở khoá toàn bộ
  eval_strategy: "steps"
  eval_steps: 250
  save_strategy: "steps"
  save_steps: 250
  save_total_limit: 2
  logging_steps: 100
  metric_for_best_model: "rougeL"
  greater_is_better: true
  load_best_model_at_end: true
  early_stopping_patience: 3

generation:
  max_length: 128
  min_length: 10
  num_beams: 4
  length_penalty: 1.0
  no_repeat_ngram_size: 3
  repetition_penalty: 1.0
  early_stopping: true

lora:
  enabled: false
